<style>

  --accent:#0f9d94; --accent-ink:#fff; --accent-soft:#d6f3ef;
  --p1:#d92d20; --p1s:#ffe1dd; --p2:#a35b00; --p2s:#ffeec9; --p3:#4a5fd0; --p3s:#e4e8ff; --done:#1f9d55;

  :root{--bg:#171b22;--panel:#1f252e;--ink:#eceae4;--muted:#9aa4ab;--line:#303845;

}
*{box-sizing:border-box}
html,body{margin:0}
html{overflow-y:scroll;scrollbar-gutter:stable}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(100deg,var(--hero1),var(--hero2) 55%,var(--hero3));color:#fff;padding:12px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.12)}

header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px;text-shadow:0 1px 2px rgba(0,0,0,.18)}

nav{display:flex;gap:8px;margin-left:8px}

.gres{margin-bottom:18px}.gres h3{margin:0 0 6px;font-size:16px}.gsrc{margin:6px 0 2px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.ghit{padding:6px 10px;border-radius:8px;cursor:pointer;font-size:14px;border:1px solid transparent}.ghit:hover{background:var(--code);border-color:var(--line)}

.btn:hover,nav button:hover{border-color:var(--accent)}
.btn.primary,.btn.small:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.spacer{flex:1}
main{max-width:1100px;margin:0 auto;padding:24px;min-height:calc(100vh - 90px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.seg button{border:0;background:var(--panel);color:var(--ink);font:inherit;padding:7px 16px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:650}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr));gap:16px}
.card{--c:var(--accent);background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:16px 18px;transition:transform .25s ease,box-shadow .25s ease,background-color .35s ease;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.card{cursor:pointer}
.rank{display:none}
.vseg button{padding:6px 11px}
.grid.list{grid-template-columns:1fr;gap:8px}
.listhead,.grid.list{--cols:34px minmax(0,1fr) minmax(230px,310px) 172px 138px}
.mrow{position:relative}

.cal{position:absolute;z-index:20;top:calc(100% + 4px);left:0;width:268px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:12px;animation:calin .18s ease}

.calf{display:flex;justify-content:space-between;margin-top:8px}
.card.dnd{cursor:grab}.card.dnd:active{cursor:grabbing}
.card.dragging{opacity:.4}
.listhead{display:none}
.grid.list .card{display:grid;grid-template-columns:var(--cols);align-items:center;column-gap:16px;padding:11px 16px;border-top:1px solid var(--line);border-left:5px solid var(--c)}

.nodl{display:none}
.grid.list .card:hover{transform:translateX(2px)}
.hdr-wrap{display:contents}
.listhead.on{display:grid;grid-template-columns:var(--cols);column-gap:16px;padding:0 16px 0 21px;margin:0 0 6px;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:650}
@media (max-width:900px){.grid.list .nodl{display:none}.listhead.on{display:none}.grid.list .card{grid-template-columns:30px minmax(0,1fr) auto;row-gap:6px}.grid.list .cardprio{grid-column:2 / -1}.grid.list .c-dl{grid-column:2}.grid.list .c-upd{grid-column:3;grid-row:3}}

.grid.list .card.ovl{box-shadow:0 -3px 0 var(--accent)}.grid.list .card.ovr{box-shadow:0 3px 0 var(--accent)}
.card:hover{transform:translateY(-2px);background-color:color-mix(in srgb,var(--c) 8%,var(--panel))}
.card h2{margin:0;font-size:17px;cursor:pointer;color:var(--c)}
.card h2:hover{text-decoration:underline}
.card .meta{color:var(--muted);font-size:12.5px}
.card p{margin:0;color:var(--ink);font-size:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;gap:8px;align-items:center;margin-top:auto;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;display:inline-block}
.chip.P1{background:var(--p1s);color:var(--p1)} .chip.P2{background:var(--p2s);color:var(--p2)} .chip.P3{background:var(--p3s);color:var(--p3)} .chip.none{background:var(--code);color:var(--muted)}
.chip[data-prioopen]{transition:transform .25s ease,box-shadow .25s ease}.chip[data-prioopen]:hover{transform:translateY(-1px);box-shadow:0 0 0 3px color-mix(in srgb,currentColor 14%,transparent)}
.chip.test{background:#e8defa;color:#6b3fc2}@media (prefers-color-scheme:dark){.chip.test{background:#33264f;color:#cdb6ff}}
.chip.wait{background:var(--p3s);color:var(--p3)}
.kb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:stretch;padding:2px 2px 8px}
main.wide{max-width:2400px}
/* nel kanban del progetto intestazione e schede restano larghe e allineate come nelle altre schede */
main.wide .dtop{max-width:1052px;margin-left:auto;margin-right:auto}
.kcard .head{flex-wrap:nowrap;align-items:flex-start}.kcard .head .chip{flex:none;margin-top:1px}.kcard .ttl{flex:1;min-width:0;overflow-wrap:anywhere}.kcard .det{overflow-wrap:anywhere}
.pbar{position:sticky;top:var(--hh,52px);height:0;z-index:4}

.kcol .khead{position:sticky;top:calc(var(--hh,52px) + var(--pb,34px));z-index:3;background:color-mix(in srgb,var(--accent) 5%,var(--panel));margin:2px -4px 6px;padding:6px 8px;border-radius:8px}

.khead{display:flex;align-items:center;gap:8px;margin:2px 4px 10px;font-size:14px}

.kcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:9px 10px;margin-bottom:8px;cursor:grab;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease}
.kcard:hover{transform:translateY(-1px)}.kcard.dragging{opacity:.4}

.chip.run{background:var(--accent-soft);color:var(--accent)}
.kcard.pk{cursor:pointer}.pkchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.pkdl{margin-top:6px}

.modal.tp{width:min(1000px,100%);max-height:calc(100vh - 32px);overflow:auto;gap:12px}
.tpmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chip.tpst{background:var(--code);color:var(--muted)}

.crumb{margin-bottom:12px}

<script>
'use strict';
const STATE_FILE='_STATO-PROGETTI.json';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let root=null, projects=[], states={}, view='progetti', filterState='in corso', detail=null, detailTab='TODO';
let tabPrio='',gQ='',editOpen=false,renaming=false,docFile='',todoPrio={P1:true,P2:true,P3:false,none:false}, showUtils=false, storicoQ='', storicoRecent=true;

/* ---------- toast ---------- */
let tt; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- IndexedDB (ricordo la cartella scelta) ---------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('bacheca',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function kvGet(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function kvSet(k,v){try{const d=await idb();await new Promise((r,j)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r;t.onerror=()=>j(t.error)})}catch(e){}}

/* ---------- Markdown minimale ---------- */
function inline(s){
  const parts=s.split('`');
  return parts.map((p,i)=>{
    if(i%2===1) return '<code>'+esc(p)+'</code>';
    let t=esc(p);
    t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    t=t.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:]|$)/g,'$1<em>$2</em>');
    t=t.replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,;:]|$)/g,'$1<em>$2</em>');
    t=t.replace(/\[([^\]]+)\]\(#([^)\s]+)\)/g,'<a href="#$2" data-anchor="$2" style="color:var(--accent)">$1</a>');
    t=t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--accent)">$1</a>');
    return t;
  }).join('');
}
const slug=s=>s.replace(/`/g,'').replace(/\*\*/g,'').toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu,'').trim().replace(/\s/g,'-');
function md(src){
  const L=src.replace(/\r/g,'').split('\n'), out=[]; let i=0;
  const isBlock=l=>/^(#{1,6}\s|```|>|\s*([-*]|\d+\.)\s|\s*\|)/.test(l)||/^\s*(---+|\*\*\*+)\s*$/.test(l);
  while(i<L.length){
    const l=L[i];
    if(/^```/.test(l)){let b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;out.push('<pre><code>'+esc(b.join('\n'))+'</code></pre>');continue}
    let m=l.match(/^(#{1,6})\s+(.*)$/); if(m){out.push(`<h${m[1].length} id="d-${esc(slug(m[2]))}">${inline(m[2])}</h${m[1].length}>`);i++;continue}
    if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){out.push('<hr>');i++;continue}
    if(/^\s*\|/.test(l)&&i+1<L.length&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(L[i+1])){
      const row=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const h=row(l);i+=2;const rows=[];while(i<L.length&&/^\s*\|/.test(L[i]))rows.push(row(L[i++]));
      out.push('<table><thead><tr>'+h.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td'+(/^\d{4}-\d{2}-\d{2}$/.test(c)?' style="white-space:nowrap"':'')+'>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>');continue}
    if(/^>/.test(l)){let b=[];while(i<L.length&&/^>/.test(L[i]))b.push(L[i++].replace(/^>\s?/,''));out.push('<blockquote>'+b.map(inline).join('<br>')+'</blockquote>');continue}
    m=l.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if(m){while(i<L.length){const k=L[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);if(!k)break;
      const lvl=Math.floor(k[1].length/2);let bl=/\d/.test(k[2])?k[2]:'•',tx=k[3];const tk=tx.match(/^\[( |x|X)\]\s+(.*)$/);if(tk){bl=tk[1]===' '?'☐':'☑';tx=tk[2]}out.push(`<div class="li" style="margin-left:${lvl*18}px"><span class="b">${bl}</span><span>${inline(tx)}</span></div>`);i++}continue}
    if(!l.trim()){i++;continue}
    let b=[l];i++;while(i<L.length&&L[i].trim()&&!isBlock(L[i]))b.push(L[i++]);
    out.push('<p>'+b.map(inline).join('<br>')+'</p>');
  }
  return out.join('\n');
}

/* ---------- file helpers ---------- */
async function readText(dir,name){try{const fh=await dir.getFileHandle(name);const f=await fh.getFile();return {text:await f.text(),mtime:f.lastModified}}catch(e){return null}}
async function writeText(dir,name,text){const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(text);await w.close()}

/* ---------- UTILS cifrato (AES-256-GCM, chiave da password con PBKDF2) ---------- */
const UTILS_STUB='# UTILS cifrato\n\nIl contenuto riservato è in `UTILS.enc` (AES-256-GCM) e si apre solo dalla bacheca, con la password.\nNon scrivere credenziali in questo file.\n';
let utilsPw='',utilsPlain={},utilsEdit=false,utilsMode='',utilsErr='',utilsBusy=false,utilsLast=0;
const b64=u=>{let t='';for(const c of u)t+=String.fromCharCode(c);return btoa(t)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function deriveKey(pw,salt,iter){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encText(text,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=600000;const key=await deriveKey(pw,salt,iter);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text)));return JSON.stringify({v:1,alg:'AES-256-GCM',kdf:'PBKDF2-SHA256',iter,salt:b64(salt),iv:b64(iv),ct:b64(ct)},null,1)+'\n'}
async function decText(json,pw){const o=JSON.parse(json);const key=await deriveKey(pw,unb64(o.salt),o.iter);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct)))}
function utilsLock(msg){utilsPw='';utilsPlain={};utilsEdit=false;utilsMode='';showUtils=false;if(msg)toast(msg)}
setInterval(()=>{if(utilsPw&&Date.now()-utilsLast>5*60000){utilsLock('UTILS bloccati per inattività');if(detailTab==='UTILS'&&root)render()}},15000);
['click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(utilsPw)utilsLast=Date.now()},true));

/* ---------- TODO ---------- */
const ITEM=/^(\s*)- \[( |~|x|X|\?|t|T)\]\s*(?:\*\*(P[123])\*\*\s*)?(.*)$/;
function autoTitle(t){
  let x=t.replace(/`/g,'').replace(/\*\*/g,'').replace(/\s+/g,' ').trim();
  const cut=x.search(/:\s|\s\(|\.\s|;\s| — /); if(cut>8)x=x.slice(0,cut);
  const w=x.split(' ');return w.length>5?w.slice(0,5).join(' ')+'…':x;
}
function splitTitle(it){
  const m=it.text.match(/^\*\*([^*]{2,70}?)\*\*\s*(?:[—–]\s*|-\s+|:\s*)?([\s\S]*)$/);
  if(m){it.title=m[1].trim();it.detail=m[2].trim();it.auto=false}
  else{it.title=autoTitle(it.text);it.detail=it.text;it.auto=true}
}
function parseTodo(text){
  const lines=text.split(/\r?\n/), items=[]; let sec='';
  lines.forEach((l,idx)=>{
    const h=l.match(/^#{2,3}\s+(.*)/); if(h){sec=h[1];return}
    const m=l.match(ITEM); if(m){let tx=m[4],dd='';const dm=tx.match(/\s*✓\s*(\d{4}-\d{2}-\d{2})\s*$/);if(dm){dd=dm[1];tx=tx.slice(0,dm.index)}const it={idx,raw:l,mark:m[2].toLowerCase(),prio:m[3]||'none',text:tx,sec,doneDate:dd};splitTitle(it);items.push(it)}
  });
  return {lines,items};
}

const SUPERSEDED={'_importazioni':{guide:'Regole_importazioni.md',old:['README.txt','CFA_Installazione.md']}};
const tipoOf=n=>(states[n]&&states[n].tipo)||(DEFAULT_DOC.includes(n)?'documentazione':'progetto');
async function loadProject(dir){
  const p={name:dir.name,dir,files:{},docs:[]};
  {
    for await(const [fn,fh] of dir.entries()){
      if(fh.kind==='file'&&/\.pdf$/i.test(fn)){(p.pdfs=p.pdfs||[]).push(fn);continue}
      if(fh.kind!=='file'||!/\.(md|txt)$/i.test(fn)||STD.includes(fn)||/utils|passw|credenz|^~\$/i.test(fn))continue;
      try{const f=await fh.getFile();if(f.size<=600000)p.docs.push({name:fn,text:await f.text(),mtime:f.lastModified})}catch(e){}
    }
    p.docs.sort((a,b)=>a.name.localeCompare(b.name,'it',{sensitivity:'base'}));
    const sup=SUPERSEDED[dir.name]; if(sup&&p.docs.some(d=>d.name===sup.guide))p.docs=p.docs.filter(d=>!sup.old.includes(d.name));
  }
  for(const f of ['SAL.md','TODO.md','STORICO.md','UTILS.md']) p.files[f]=await readText(dir,f);
  p.enc=await readText(dir,'UTILS.enc');
  const sal=p.files['SAL.md']?.text||'';
  const d=sal.match(/Ultimo aggiornamento:\s*(\d{4}-\d{2}-\d{2})/i);
  const mt=Math.max(...Object.values(p.files).filter(Boolean).map(x=>x.mtime),0);
  p.updated=d?d[1]:(mt?new Date(mt).toISOString().slice(0,10):'');
  p.updatedTs=mt;
  const sc=sal.match(/##\s*Scopo\s*\n+([\s\S]*?)(?=\n##|\n*$)/);
  let ex=sc?sc[1]:sal.split(/\n/).filter(l=>l.trim()&&!/^[#_>]/.test(l)&&!/^\W*ultimo aggiornamento/i.test(l)).join(' ');
  p.excerpt=ex.replace(/[*`_]/g,'').replace(/\s+/g,' ').trim().slice(0,260);
  p.todo=p.files['TODO.md']?parseTodo(p.files['TODO.md'].text):{lines:[],items:[]};
  const open=p.todo.items.filter(i=>i.mark!=='x');
  p.open={P1:0,P2:0,P3:0,none:0};open.forEach(i=>p.open[i.prio]++);
  p.openCount=open.length;
  return p;
}

function dlInfo(n){

  const days=Math.round((new Date(y,m-1,g)-t)/DAY), dd=`${String(g).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`;
  const txt=days<0?`scaduto da ${-days} g`:days===0?'scade oggi':days===1?'scade domani':`scade tra ${days} g`;
  const short=days<0?`scaduto ${-days} g`:days===0?'oggi':days===1?'domani':`${days} g`;
  return {days,date:d,dd,txt,short,cls:days<0?'late':days<=7?'soon':days<=30?'near':'far'};

function applyMark(line,newMark){
  let l=line.replace(/\[( |~|x|X|\?|t|T)\]/,'['+newMark+']').replace(/\s*✓\s*\d{4}-\d{2}-\d{2}\s*$/,'');

function lineIdx(lines,item){
  if(lines[item.idx]===item.raw)return item.idx;
  const f=lines.map((l,i)=>l===item.raw?i:-1).filter(i=>i>=0);return f.length===1?f[0]:-1;
}
/* sposta la riga di un'attività prima/dopo un'altra (e, se serve, cambia il marcatore): l'ordine delle righe nel TODO.md è l'ordine manuale */
async function moveTask(srcKey,dstKey,before,newMark){
  const [p,si]=findItem(srcKey), [p2,di]=findItem(dstKey);
  if(!p||!si||!di||p!==p2||si===di)return;
  try{
    const cur=await readText(p.dir,'TODO.md'); if(!cur)throw 0;
    const eol=cur.text.includes('\r\n')?'\r\n':'\n', lines=cur.text.split(/\r?\n/);
    const a=lineIdx(lines,si), b=lineIdx(lines,di);
    if(a<0||b<0){toast('Il TODO è cambiato nel frattempo: ricarico');await refresh();return}
    let ln=lines.splice(a,1)[0];
    if(newMark!==undefined&&newMark!==si.mark)ln=applyMark(ln,newMark);
    const bb=b>a?b-1:b;
    lines.splice(before?bb:bb+1,0,ln);
    await writeText(p.dir,'TODO.md',lines.join(eol));
    await refresh(true);
  }catch(e){toast('Scrittura non riuscita (permesso?)')}
}

function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function snippet(line,q){

  const i=s.toLowerCase().indexOf(q); let a=Math.max(0,i-60), b=Math.min(s.length,i+q.length+120);

}

async function addTask(){
  const n=newTask; if(!n)return;
  const title=(n.title||'').replace(/\*\*/g,'').replace(/\s+/g,' ').trim();
  if(title.length<2){toast('Scrivi un titolo');return}
  const p=projects.find(x=>x.name===n.pname); if(!p){toast('Scegli il progetto');return}
  const detail=(n.detail||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>/[.;:!?]$/.test(x)?x:x+'.').join(' ');
  const line=`- [${n.mark}] ${n.prio&&n.prio!=='none'?`**${n.prio}** `:''}**${title}**${detail?` — ${detail}`:''}`;
  const sec=(n.secSel==='__new'?(n.secNew||'').trim():(n.secSel||'')).replace(/\s+/g,' ');
  const d=new Date(), today=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  try{
    const cur=await readText(p.dir,'TODO.md');
    let out;
    if(!cur){out=`# ${label(p.name)} — TODO\n\n_Ultimo aggiornamento: ${today}_\n\n## ${sec||'Da fare'}\n${line}\n`}
    else{
      const eol=cur.text.includes('\r\n')?'\r\n':'\n', lines=cur.text.split(/\r?\n/);
      const hi=sec?lines.findIndex(l=>{const h=l.match(/^#{2,3}\s+(.*)/);return h&&h[1].trim()===sec}):-1;
      if(hi>=0){
        let end=lines.length;for(let i=hi+1;i<lines.length;i++){if(/^#{1,3}\s/.test(lines[i])){end=i;break}}
        let last=hi;for(let i=end-1;i>hi;i--){if(lines[i].trim()){last=i;break}}
        lines.splice(last+1,0,line);
      }else if(sec){
        while(lines.length&&!lines[lines.length-1].trim())lines.pop();
        lines.push('','## '+sec,line,'');
      }else{
        while(lines.length&&!lines[lines.length-1].trim())lines.pop();
        lines.push(line,'');
      }
      out=lines.join(eol).replace(/(_Ultimo aggiornamento:\s*)\d{4}-\d{2}-\d{2}/,'$1'+today);
    }
    await writeText(p.dir,'TODO.md',out);
    newTask=null; await refresh(true); toast('Attività aggiunta a '+label(p.name));
  }catch(e){toast('Scrittura non riuscita (permesso?)')}
}

document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card.dnd');if(!c)return;dragName=c.dataset.card;c.classList.add('dragging');try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragName)}catch(x){}});
document.addEventListener('dragover',e=>{if(!dragName)return;const c=e.target.closest('.card.dnd');if(!c||c.dataset.card===dragName)return;e.preventDefault();clrOv();const r=c.getBoundingClientRect();const lst=c.parentElement.classList.contains('list');c.classList.add((lst?e.clientY<r.top+r.height/2:e.clientX<r.left+r.width/2)?'ovl':'ovr')});
document.addEventListener('dragend',()=>{dragName=null;clrOv();document.querySelectorAll('.card.dragging').forEach(c=>c.classList.remove('dragging'))});
document.addEventListener('drop',async e=>{
  const c=e.target.closest&&e.target.closest('.card.dnd');if(!dragName||!c)return;e.preventDefault();
  const before=c.classList.contains('ovl'), from=dragName, to=c.dataset.card; dragName=null; clrOv();
  if(from===to)return;
  const vis=[...document.querySelectorAll('.card.dnd')].map(x=>x.dataset.card).filter(n=>n!==from);
  vis.splice(vis.indexOf(to)+(before?0:1),0,from);
  try{
    const cur=await readState(); const old=(cur.__ordine||[]).filter(n=>!vis.includes(n));
    cur.__ordine=vis.concat(old);
    await writeText(root,STATE_FILE,JSON.stringify(cur,null,2)+'\n');
    states=cur; render();
  }catch(err){toast('Scrittura non riuscita (permesso?)')}
});
async function utilsAction(id){
  const p=projects.find(x=>x.name===detail); if(!p||utilsBusy)return;
  const busy=v=>{utilsBusy=v;render()};
  try{
    if(id==='uunlock'){
      const pw=utilsPw||($('#upw')||{}).value||''; if(!pw){utilsErr='Inserisci la password';render();return}
      busy(true);
      try{utilsPlain[p.name]=await decText(p.enc.text,pw);utilsPw=pw;utilsLast=Date.now();showUtils=true;utilsErr=''}
      catch(e){utilsPw='';utilsErr='Password errata (o file danneggiato)'}
      utilsBusy=false;render();return;
    }
    if(id==='uencgo'){
      const a=($('#upw')||{}).value||'',b=($('#upw2')||{}).value||'';
      if(a.length<12){utilsErr='La password deve avere almeno 12 caratteri';render();return}
      if(a!==b){utilsErr='Le due password non coincidono';render();return}
      busy(true);
      const create=utilsMode==='create';
      const text=create?'# UTILS — '+p.name+'\n\n':(await readText(p.dir,'UTILS.md')).text;
      const enc=await encText(text,a);
      if(await decText(enc,a)!==text)throw new Error('verifica cifratura fallita');
      await writeText(p.dir,'UTILS.enc',enc);
      const back=await readText(p.dir,'UTILS.enc'); if(!back||await decText(back.text,a)!==text)throw new Error('verifica del file scritto fallita');
      if(!create)await writeText(p.dir,'UTILS.md',UTILS_STUB); else if(!p.files['UTILS.md'])await writeText(p.dir,'UTILS.md',UTILS_STUB);
      utilsPw=a;utilsPlain[p.name]=text;utilsLast=Date.now();showUtils=true;utilsMode='';utilsErr='';utilsEdit=create;utilsBusy=false;
      await loadAll();render();toast('UTILS cifrato');return;
    }
    if(id==='usave'){
      const text=($('#utext')||{}).value??'';
      busy(true);
      const enc=await encText(text,utilsPw);
      if(await decText(enc,utilsPw)!==text)throw new Error('verifica fallita');
      await writeText(p.dir,'UTILS.enc',enc);
      utilsPlain[p.name]=text;utilsEdit=false;utilsBusy=false;
      await loadAll();render();toast('UTILS salvato (cifrato)');return;
    }
  }catch(err){utilsBusy=false;utilsErr='Operazione non riuscita: '+(err&&err.message||err);render()}
}
document.addEventListener('keydown',e=>{if(newTask&&((e.key==='Enter'&&(e.target.id==='ntTitle'||e.target.id==='ntSecNew'))||(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.id==='ntDetail'))){e.preventDefault();addTask();return}
  if(e.key==='Enter'&&(e.target.id==='upw'||e.target.id==='upw2')){e.preventDefault();const b=$('#uunlock')||$('#uencgo');if(b)b.click()}});
(()=>{const hdr=document.querySelector('header');const upd=()=>{const h=hdr.offsetHeight;document.documentElement.style.setProperty('--hh',h+'px');const t=document.getElementById('ptitle'),b=document.getElementById('pbar');if(t&&b)b.classList.toggle('show',t.getBoundingClientRect().bottom<h+4)};window.addEventListener('scroll',upd,{passive:true});window.addEventListener('resize',upd);new MutationObserver(upd).observe(document.getElementById('main')||document.body,{childList:true,subtree:true});upd()})();
(()=>{const b=document.getElementById('totop');const upd=()=>b.classList.toggle('show',window.scrollY>400);window.addEventListener('scroll',upd,{passive:true});upd()})();
document.addEventListener('click',async e=>{
  if(e.target.closest&&e.target.closest('#totop')){window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});return}
  if(calOpen&&!e.target.closest('.cal,#scad')){calOpen=false;render()}
  if(sortMenu&&!e.target.closest('.fpop,#fbtn')){sortMenu=false;render()}
  if(ntDD&&!e.target.closest('.ddpop,.dd')){ntDD='';render();return}
  const t=e.target.closest('button,h2[data-open],.proj-tag,.head[data-exp],.kcard[data-kk],[data-dledit],[data-gopen],[data-sort],[data-prioopen],[data-clrprio],#home');
  {const an=e.target.closest('a[data-anchor]');if(an){e.preventDefault();const el=document.getElementById('d-'+an.dataset.anchor);if(el){const hd=document.querySelector('header'),off=(hd?hd.getBoundingClientRect().height:0)+14;window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-off,behavior:'smooth'})}return}}
  if(!t){if(e.target.classList.contains('mback')){editOpen=false;taskPop='';newTask=null;ntDD='';render();return}const c=e.target.closest('.card[data-card]');if(c&&!e.target.closest('input,a,label')){go({detail:c.dataset.card,tab:defTab(c.dataset.card)})}const k=e.target.closest('.kcard[data-kp]');if(k&&!e.target.closest('input,a,label')){go({detail:k.dataset.kp,tab:defTab(k.dataset.kp)})}return}
  if(t.id==='pick'){try{root=await window.showDirectoryPicker({mode:'readwrite',id:'bacheca-projects'});await kvSet('root',root);await loadAll();render()}catch(err){if(err.name!=='AbortError')toast('Impossibile aprire la cartella')}return}
  if(t.id==='reconn'){const r=await root.requestPermission({mode:'readwrite'});if(r==='granted'){await loadAll();render()}else welcome('Permesso negato. Riprova.');return}
  if(t.id==='burger'){const m=$('#bmenu');m.hidden=!m.hidden;return}
  if(t.id==='mrefresh'){$('#bmenu').hidden=true;await refresh();return}
  if(t.id==='mchange'){$('#bmenu').hidden=true;welcome();return}
  if(t.id==='settings'){const m=$('#setmenu');m.hidden=!m.hidden;return}
  if(t.id==='change'){$('#setmenu').hidden=true;welcome();return}
  if(t.id==='refresh'){
    if(t.classList.contains('spin'))return;
    t.classList.add('spin');
    try{await refresh()}finally{
      /* gira finché sta caricando e si ferma a giro completo, quindi la rotazione è sempre un numero intero di giri */
      t.addEventListener('animationiteration',()=>t.classList.remove('spin'),{once:true});
    }
    return;
  }
  if(t.id==='home'){if(root&&!$('#nav').hidden){go({view:'progetti',detail:null})}return}
  if(t.id==='back'){if(history.state&&history.state.detail&&history.length>1)history.back();else go({detail:null});return}
  if(t.id==='ucreate'){utilsMode='create';utilsErr='';render();return}
  if(t.id==='uencrypt'){utilsMode='encrypt';utilsErr='';render();return}
  if(t.id==='ucancel'){utilsMode='';utilsEdit=false;utilsErr='';render();return}
  if(t.id==='ulock'){utilsLock('UTILS bloccati');render();return}
  if(t.id==='uedit'){utilsEdit=true;render();return}
  if(t.id==='uunlock'||t.id==='uencgo'||t.id==='usave'){await utilsAction(t.id);return}
  if(t.id==='showutils'){showUtils=true;render();return}
  if(t.id==='hideutils'){showUtils=false;render();return}
  if(t.dataset.v){$('#bmenu').hidden=true;go({view:t.dataset.v,detail:null});return}
  if(t.dataset.fs){filterState=t.dataset.fs;keep();render();return}
  if(t.dataset.open){go({detail:t.dataset.open,tab:defTab(t.dataset.open)});return}
  if(t.dataset.tab){detailTab=t.dataset.tab;showUtils=false;keep();render();return}
  if(t.dataset.color!==undefined&&t.classList.contains('sw')||t.dataset.color===''){await setProjectColor(detail,t.dataset.color||null);return}
  if(t.dataset.scadclear){calOpen=false;await setProjectScadenza(detail,'');return}
  if(t.dataset.cnav){calM+=+t.dataset.cnav;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}render();return}
  if(t.dataset.cday){calOpen=false;await setProjectScadenza(detail,t.dataset.cday);return}
  if(t.id==='scad'){if(calOpen){calOpen=false}else{const v=(states[detail]&&states[detail].scadenza)||'';const d=/^\d{4}-\d{2}-\d{2}$/.test(v)?new Date(v+'T00:00:00'):new Date();calY=d.getFullYear();calM=d.getMonth();calOpen=true}render();return}
  if(t.dataset.gopen){const q=gQ.trim(),n=t.dataset.gopen,tab=t.dataset.gtab,df=t.dataset.gdoc;
    go({detail:n,tab});if(df)docFile=df;storicoQ=tab==='UTILS'?'':q;render();window.scrollTo(0,0);return}
  if(t.dataset.prioopen){const n=t.dataset.pname;go({detail:n,tab:defTab(n)});tabPrio=t.dataset.prioopen;render();return}
  if(t.dataset.clrprio){tabPrio='';render();return}
  if(t.dataset.doingfirst){doingFirst=!doingFirst;try{localStorage.setItem('bacheca-doingfirst',doingFirst?'1':'0')}catch(e){}render();return}
  if(t.id==='fbtn'){sortMenu=!sortMenu;render();return}
  if(t.dataset.view){sortMenu=false;viewMode=t.dataset.view;try{localStorage.setItem('bacheca-view',viewMode)}catch(e){}render();return}
  if(t.dataset.sort){sortMenu=false;sortKey=t.dataset.sort;try{localStorage.setItem('bacheca-sort',sortKey)}catch(e){}render();return}
  if(t.dataset.dledit){const n=t.dataset.dledit;if(detail!==n)go({detail:n,tab:defTab(n)});editOpen=true;render();return}
  if(t.dataset.medit){editOpen=true;render();return}
  if(t.dataset.mclose){editOpen=false;calOpen=false;taskPop='';newTask=null;ntDD='';render();return}
  if(t.dataset.rnsave){await setProjectNome(detail,$('#rnin').value);return}
  if(t.dataset.tipo){await setProjectTipo(detail,t.dataset.tipo);return}
  if(t.dataset.doc){docFile=t.dataset.doc;render();return}
  if(t.dataset.toggle){editOpen=false;const n=t.dataset.toggle;try{await setProjectState(n,!isDone(projects.find(p=>p.name===n)))}catch(err){toast('Scrittura non riuscita')}return}
  if(t.dataset.exp){const k=t.dataset.exp;openRows.has(k)?openRows.delete(k):openRows.add(k);render();return}
  if(t.dataset.expall){const on=t.dataset.expall==='1';projects.forEach(p=>p.todo.items.forEach(i=>{const k=rkey(p,i);on?openRows.add(k):openRows.delete(k)}));render();return}
  if(t.dataset.pkmenu){pkMenu=pkMenu===t.dataset.pkmenu?'':t.dataset.pkmenu;render();return}
  if(t.dataset.pkup||t.dataset.pkdown){const n=t.dataset.pkup||t.dataset.pkdown;pkMenu='';await nudgeProject(n,!!t.dataset.pkup);return}
  if(t.dataset.pkmove){const a=t.dataset.pkmove.split('|'),c=a.pop();pkMenu='';await setProjectKb(a.join('|'),c);return}
  if(t.dataset.pkall){pkAllDone=!pkAllDone;render();return}
  if(t.dataset.pkset){editOpen=false;await setProjectKb(detail,t.dataset.pkset);return}
  if(t.dataset.dd){ntDD=ntDD===t.dataset.dd?'':t.dataset.dd;render();return}
  if(t.dataset.ddv&&newTask){const [id,ix]=t.dataset.ddv.split('|'),o=(ddOpts[id]||[])[+ix];ntDD='';if(o){if(id==='ntSec')newTask.secSel=o[0];else if(id==='ntProj'){newTask.pname=o[0];const p=projects.find(x=>x.name===o[0]);newTask.secSel=p?ntDefSec(p):''}}render();return}
  if(t.dataset.nt!==undefined){taskPop='';ntDD='';openNewTask(t.dataset.nt||' ',detail||'');return}
  if(t.dataset.ntprio&&newTask){newTask.prio=t.dataset.ntprio;document.querySelectorAll('[data-ntprio]').forEach(b=>b.classList.toggle('on',b.dataset.ntprio===newTask.prio));return}
  if(t.dataset.ntmark!==undefined&&newTask){newTask.mark=t.dataset.ntmark;document.querySelectorAll('[data-ntmark]').forEach(b=>b.classList.toggle('on',b.dataset.ntmark===newTask.mark));return}
  if(t.id==='ntsave'){await addTask();return}
  if(t.dataset.kk){taskPop=t.dataset.kk;kbMenu='';render();return}
  if(t.dataset.kprio!==undefined){tabPrio=t.dataset.kprio;render();return}
  if(t.dataset.kup||t.dataset.kdown){const key=t.dataset.kup||t.dataset.kdown,up=!!t.dataset.kup,el=document.querySelector('.kcard[data-kk="'+(window.CSS&&CSS.escape?CSS.escape(key):key)+'"]');
    let nb=el&&(up?el.previousElementSibling:el.nextElementSibling);while(nb&&!(nb.classList.contains('kcard')&&nb.dataset.prio===el.dataset.prio))nb=up?nb.previousElementSibling:nb.nextElementSibling;
    if(nb){kbMenu='';await moveTask(key,nb.dataset.kk,up)}else{toast(up?'È già il primo della sua priorità':'È già l\'ultimo della sua priorità')}return}
  if(t.dataset.kall){kbAllDone=!kbAllDone;render();return}
  if(t.dataset.kmenu){kbMenu=kbMenu===t.dataset.kmenu?'':t.dataset.kmenu;render();return}
  if(t.dataset.kpset){const a=t.dataset.kpset.split('|'),np=a.pop();const [p,i]=findItem(a.join('|'));if(p&&i&&i.prio!==np)await setPrio(p.name,i,np);return}
  if(t.dataset.kmove){const a=t.dataset.kmove.split('|'),mk=a.pop();kbMenu='';taskPop='';const [p,i]=findItem(a.join('|'));if(p&&i)await setMark(p.name,i,mk);else render();return}
  if(t.dataset.doing){const [p,i]=findItem(t.dataset.doing);await setMark(p.name,i,i.mark==='~'?' ':'~');return}

document.addEventListener('keydown',e=>{if(e.target.id==='gq'&&e.key==='Escape'){gQ='';e.target.value='';render();return}
